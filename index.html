<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZingTalk</title>
    <meta name="description" content="Real-time chat and audio/video calling web application with peer communication and contact management.">
    <meta property="og:title" content="ZingTalk">
    <meta property="og:description" content="Real-time chat and audio/video calling web application with peer communication and contact management.">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <div id="login-screen" class="screen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; overflow-y: auto; padding: 20px;">
        <div class="login-container" style="max-width: 360px; width: 100%;">
            <h1>ZingTalk</h1>
            <p style="color: #666; font-size: 14px; text-align: center; margin-top: -15px;">Connect instantly with chat & calling</p>
            
            <button id="google-login-btn" class="primary-btn" style="width: 100%;">Login with Google</button>

            <div style="display: flex; align-items: center; width: 100%; gap: 10px; margin: 10px 0;">
                <hr style="flex: 1; border: none; border-top: 1px solid #ddd;">
                <span style="color: #888; font-size: 12px; font-weight: 600;">OR CONTINUE AS GUEST</span>
                <hr style="flex: 1; border: none; border-top: 1px solid #ddd;">
            </div>

            <div style="width: 100%; display: flex; flex-direction: column; gap: 10px;">
                <input type="text" id="guest-name-input" placeholder="Enter your display name" style="width: 100%; padding: 12px 16px; border: 1px solid #ccc; border-radius: 25px; font-size: 14px; outline: none; box-sizing: border-box;">
                <button id="guest-login-btn" class="primary-btn" style="background-color: #25D366; width: 100%;">Start Chatting</button>
            </div>
            
            <div id="login-message" style="display: none; font-size: 12px; color: #d32f2f; text-align: center; margin-top: 5px;"></div>
        </div>
    </div>

    <div id="main-screen" class="screen hidden">
        <header class="main-header">
            <div id="my-profile" class="profile-section">
                <div id="my-avatar" class="avatar"></div>
                <div class="user-details">
                    <span id="my-name" class="name-text"></span>
                    <span id="my-uid" class="uid-text"></span>
                </div>
            </div>
        </header>

        <div class="search-section">
            <input type="number" id="search-uid-input" placeholder="Enter 5-digit UID">
            <input type="text" id="save-name-input" placeholder="Custom Name">
            <button id="save-contact-btn" class="action-btn">Save</button>
        </div>

        <div id="contacts-list" class="list-container"></div>
    </div>

    <div id="chat-screen" class="screen hidden">
        <header class="chat-header">
            <button id="back-btn" class="icon-btn">Back</button>
            <div class="chat-contact-info">
                <div id="chat-avatar" class="avatar small"></div>
                <span id="chat-contact-name" class="name-text"></span>
            </div>
            <div class="call-buttons">
                <button id="audio-call-btn" class="icon-btn">Audio</button>
                <button id="video-call-btn" class="icon-btn">Video</button>
            </div>
        </header>

        <div id="messages-area" class="messages-container"></div>

        <div class="input-area">
            <input type="text" id="message-input" placeholder="Message...">
            <button id="send-btn" class="action-btn">Send</button>
        </div>
    </div>

    <div id="call-screen-container">
        <div id="full-call-screen" class="hidden">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
            <div class="call-controls">
                <button id="end-call-btn" class="danger-btn">End Call</button>
            </div>
        </div>
        <div id="incoming-call-overlay" class="hidden">
            <h2 id="caller-name-display"></h2>
            <div class="call-actions">
                <button id="accept-call-btn" class="accept-btn">Accept</button>
                <button id="reject-call-btn" class="reject-btn">Reject</button>
            </div>
        </div>
        <div id="outgoing-call-overlay" class="hidden">
            <h2 id="outgoing-call-name"></h2>
            <div class="call-actions">
                <button id="cancel-outgoing-btn" class="reject-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background-color: #333; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 10000000;"></div>

    <script type="module" src="app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
